# Woodpecker 3.18 JS-only checks. No native proof binaries are required.
# Our agents run backend=local: the local backend executes steps directly in the
# agent container and uses `image` AS THE STEP SHELL binary (v3.18.1
# execCommands → exec(image, ["-e","-c",script])), so it must be a shell that
# exists on the agent's PATH. The agent image ships bash 5.3 + node 24.21.0 —
# the same node major version node:24-alpine would provide.
# CI trigger hygiene (post-v0.0.1): an open-PR branch is validated by the
# pull_request lane alone — pushing to it no longer duplicates the same steps.
# push CI is main-only; any branch can still be checked via a manual run.
when:
  - event: push
    branch: main
  - event: pull_request
  - event: manual
steps:
  - name: formal-js-source-and-finite-model
    image: bash
    commands:
      - node --version
      # M03 FINAL: install strictly from the Git-tracked, registry-generated
      # monorepo lockfile. Do not regenerate lock data on the CI agent.
      - npm --version
      - node -e 'const p=require("./package-lock.json").packages; if (!p || !p["packages/core"] || !p["packages/runner"]) process.exit(1)'
      - npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      - node --test tests/*.test.mjs
      - npm run typecheck
      - node packages/runner/js/cli.mjs validate
      - node packages/runner/js/cli.mjs pure dag --input validation/js/dag-positive.json
      - node packages/runner/js/cli.mjs catalog z3
      - node packages/runner/js/cli.mjs info z3
      - node packages/runner/js/cli.mjs plan z3 solve --input skills/z3/examples/positive.smt2
  # Real MCP stdio acceptance: spawns packages/runner/js/mcp.mjs as a child
  # process and speaks newline-delimited JSON-RPC over stdio (initialize ->
  # tools/list -> tools/call across all 14 registered tools, including
  # fail-closed invalid-argument checks). Exits non-zero unless every
  # assertion holds; depends on the workspace node_modules installed by the
  # preceding step (shared workspace under backend=local).
  - name: mcp-stdio-smoke
    image: bash
    commands:
      - node scripts/mcp-acceptance.mjs
  # i180/R3: web bridge conformance incl. the NL lane (apps/web/server.mjs).
  # Fully offline: providers are deterministic stubs; the suite skips real
  # DeepSeek calls when DEEPSEEK_API_KEY is unset (it is unset in CI).
  - name: web-bridge-tests
    image: bash
    commands:
      - DEEPSEEK_API_KEY= node --test apps/web-tests/*.test.mjs
