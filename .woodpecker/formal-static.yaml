# Woodpecker 3.18 JS-only checks. No native proof binaries are required.
when:
  - event: [push, pull_request]
steps:
  - name: formal-js-source-and-finite-model
    image: node:24-alpine
    commands:
      - node --test tests/*.test.mjs
      - node packages/runner/js/cli.mjs validate
      - node packages/runner/js/cli.mjs pure dag --input validation/js/dag-positive.json
      - node packages/runner/js/cli.mjs catalog z3
      - node packages/runner/js/cli.mjs info z3
      - node packages/runner/js/cli.mjs plan z3 solve --input skills/z3/examples/positive.smt2
